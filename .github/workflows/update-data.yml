name: Refresh open unequal-exchange data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "OECD main layers, BACI broad layer, or both"
        required: true
        type: choice
        options: [oecd, baci, all]
        default: oecd
      years:
        description: "Years/range, e.g. 1995:2022 or 2022 2023 2024"
        required: true
        default: "1995:2022"
  schedule:
    # Quarterly is sufficient for these source datasets and avoids unnecessary API load.
    - cron: "17 5 3 1,4,7,10 *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BACI_VERSION: ${{ vars.BACI_VERSION || '202601' }}
      # HS22 keeps scheduled/latest refresh lightweight (2022-2024).
      # For the full 1995-2024 BACI history run manually with repository variable BACI_HS=92.
      BACI_HS: ${{ vars.BACI_HS || '22' }}
      BACI_ARCHIVE_URL: ${{ vars.BACI_ARCHIVE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt

      - name: Cache downloaded public source data
        uses: actions/cache@v4
        with:
          path: cache
          key: open-data-${{ vars.BACI_VERSION || '202601' }}-${{ vars.BACI_HS || '22' }}-v3
          restore-keys: |
            open-data-${{ vars.BACI_VERSION || '202601' }}-

      - name: Build derived atlas
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            # OECD is the main scientifically stronger layer.
            python scripts/build_data.py --mode oecd --years 1995:2022
            # BACI adds newer, broader goods-only coverage.
            python scripts/build_data.py --mode baci --years 2022 2023 2024
          else
            python scripts/build_data.py --mode "${{ inputs.mode }}" --years ${{ inputs.years }}
          fi

      - name: Validate that Eora/restricted raw data are absent
        run: |
          ! grep -Ril --exclude='README.md' --exclude='DATA_LICENSES.md' 'EORA_TOKEN\|eora.org/r2' public scripts .github
          test -f public/data/meta.json
          python - <<'PY'
          import json, pathlib
          m=json.loads(pathlib.Path("public/data/meta.json").read_text())
          assert m["eora_used"] is False
          assert m["available_methods"]
          print("Methods:", ", ".join(m["available_methods"]))
          print("Years:", min(m["years"]), "to", max(m["years"]))
          PY

      - name: Commit derived results and provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "data: refresh open-data unequal-exchange estimates"
          git push
