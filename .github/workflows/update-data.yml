name: Refresh global unequal-exchange data

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years to build"
        required: true
        default: "2005:2022"
  schedule:
    - cron: "17 5 3 1,4,7,10 *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Cache downloaded source data
        uses: actions/cache@v4
        with:
          path: cache
          key: global-open-data-v2
          restore-keys: |
            global-open-data-

      - name: Build global estimates
        shell: bash
        run: |
          YEARS="${{ github.event.inputs.years || '2005:2022' }}"
          python scripts/build_data.py --clean --years $YEARS

      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          meta = json.loads(Path("public/data/meta.json").read_text())

          assert meta["mode"] == "best-available-global"
          assert meta["eora_used"] is False
          assert meta["years"]
          assert meta["view_years"]["labour_transfer"]
          assert meta["view_years"]["monetary_transfer"]

          latest = max(meta["years"])

          assert Path(
              f"public/data/labour_transfer-{latest}.json"
          ).exists()
          assert Path(
              f"public/data/monetary_transfer-{latest}.json"
          ).exists()

          print(
              "Latest-year quality:",
              meta["quality_by_year"][str(latest)],
          )
          PY

      - name: Commit derived results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "data: refresh global unequal-exchange estimates"
          git push
