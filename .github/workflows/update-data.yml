name: Build EXIOBASE atlas data
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years: e.g. 2021, 2015 2021, or 1995:2021"
        required: true
        default: "2021"
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          MATRIX=$(python scripts/plan_years.py "${{ inputs.years }}")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
  build-year:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/build_exiobase.py --year "${{ matrix.year }}"
      - name: Validate
        env:
          YEAR: ${{ matrix.year }}
        run: |
          test -f "public/data/exio/$YEAR/labour_hours-all.json"
          test -f "public/data/exio/$YEAR/producer_compensation-all.json"
          test -f "public/data/exio/$YEAR/recipient_wage_value-all.json"
          test -f "public/data/exio/$YEAR/value_transfer-all.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          y=os.environ["YEAR"];m=json.loads(Path(f"public/data/exio/{y}/manifest.json").read_text())
          assert len(m["regions"])==49
          assert len(m["row_regions"])==5
          ns=m["north_south"]
          assert "by_selection" in ns
          assert "all" in ns["by_selection"]
          assert ns["by_selection"]["all"]["north_population"] > 0
          assert ns["by_selection"]["all"]["north_gdp_eur_2005"] > 0
          print(json.dumps(ns["by_selection"]["all"],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exio-derived-${{ matrix.year }}
          path: public/data/exio/${{ matrix.year }}/
          retention-days: 3
  merge:
    needs: build-year
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: exio-derived-*
          path: _artifacts
      - run: |
          mkdir -p public/data/exio
          for d in _artifacts/exio-derived-*; do
            y="${d##*-}"
            rm -rf "public/data/exio/$y"
            mkdir -p "public/data/exio/$y"
            cp -R "$d"/. "public/data/exio/$y/"
          done
          python scripts/merge_exiobase_metadata.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/exio
          git diff --cached --quiet || git commit -m "data: build EXIOBASE derived atlas results"
          git push
